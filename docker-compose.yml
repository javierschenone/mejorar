services:
  postgres:
    image: postgres:16-alpine
    container_name: mejorar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mejorar
      POSTGRES_PASSWORD: mejorar
      POSTGRES_DB: mejorar
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mejorar']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mejorar-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    container_name: mejorar-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mejorar
      MINIO_ROOT_PASSWORD: mejorar123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
